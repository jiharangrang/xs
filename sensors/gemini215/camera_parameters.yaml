field_of_view_interpretation:
  status: 실측 시야 경계를 따로 검증한 결과가 아니라 SDK 내부 파라미터에서 계산한 핀홀 영상 시야입니다.
  horizontal_formula_latex: \theta_x=\tan^{-1}(c_x/f_x)+\tan^{-1}((W-1-c_x)/f_x)
  vertical_formula_latex: \theta_y=\tan^{-1}(c_y/f_y)+\tan^{-1}((H-1-c_y)/f_y)
  pixel_convention: 영상 양 끝 픽셀 중심 사이의 각도입니다.
  valid_depth_note: 유효 깊이 시야는 거리별 스테레오 중첩과 가림, 표면 및 매칭 조건에 따라 영상 시야보다 작아질 수 있습니다. RGB 값은 렌즈 왜곡을 반영하지 않은 핀홀 근사입니다.
