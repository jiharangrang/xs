[project]
name = "xs-inchworm"
version = "0.1.0"
description = "XS 인치웜 로봇의 기구학과 초기 자세 시각화"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "ftservo-python-sdk==2.0.0",
    "mujoco>=3.13.0",
    "numpy>=2.0",
    "pyserial>=3.5,<4",
    "pyyaml>=6.0,<7",
    "scipy>=1.14",
    "uvicorn>=0.34",
    "websockets>=14",
]

[project.optional-dependencies]
camera = [
    "opencv-python>=4.10,<5",
    "pyorbbecsdk2==2.1.2",
]

[tool.uv]
package = false
